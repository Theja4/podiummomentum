<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Mazzard; src: url('../public/fonts/MazzardM-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: Mazzard; src: url('../public/fonts/MazzardM-SemiBold.ttf'); font-weight: 600; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #040a07; }
  body { position: relative; font-family: Mazzard, Arial, sans-serif; }

  /* breathing mint glow */
  .glow {
    position: absolute; left: 50%; top: 46%; width: 1400px; height: 900px;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(103,224,163,.17) 0%, rgba(103,224,163,.07) 30%, rgba(103,224,163,.025) 48%, transparent 66%);
    animation: glowIn 4s ease-out both;
  }
  @keyframes glowIn { from { opacity: 0; transform: translate(-50%,-50%) scale(.72); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }

  .stage {
    position: absolute; inset: 0;
    padding-inline: 72px; /* title-safe — nothing rides the frame edge */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .weare {
    margin-bottom: 44px;
    font-size: 34px; font-weight: 400; letter-spacing: .42em; text-transform: uppercase;
    color: rgba(175,249,201,.72); padding-left: .42em;
    animation: fadeUp .8s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(26px); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  /* logo mark — bars rise, star pops (geometry from brand-mark.svg, padded
     viewBox so the star's tips never touch the viewport edge) */
  .mark-wrap { position: relative; width: 222px; height: 231px; }
  .mark { width: 100%; height: 100%; overflow: visible; display: block; }
  .bar1, .bar2, .bar3 {
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: barUp .8s cubic-bezier(.34,1.4,.44,1) both;
  }
  @keyframes barUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .star {
    transform-box: fill-box; transform-origin: 50% 50%;
    animation: starPop .7s cubic-bezier(.3,1.6,.5,1) both;
  }
  @keyframes starPop {
    from { opacity: 0; transform: scale(0) rotate(-100deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* expanding rings off the star at the cling — positioned as a fraction of
     the mark box, so layout changes can't misalign them */
  .ring, .ring2 {
    position: absolute; left: 80.3%; top: 19.6%; width: 130px; height: 130px;
    margin: -65px 0 0 -65px; border-radius: 50%;
    opacity: 0;
  }
  .ring {
    border: 3px solid rgba(124,240,189,.85);
    animation: ringOut .95s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes ringOut {
    from { opacity: 0; transform: scale(.25); }
    12%  { opacity: .95; }
    to   { opacity: 0; transform: scale(3.4); }
  }
  .ring2 {
    border: 1.5px solid rgba(124,240,189,.5);
    animation: ringOut2 1.15s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes ringOut2 {
    from { opacity: 0; transform: scale(.2); }
    12%  { opacity: .8; }
    to   { opacity: 0; transform: scale(4.6); }
  }

  .word { margin-top: 46px; display: flex; }
  .word span {
    display: inline-block; font-size: 132px; letter-spacing: -.028em; line-height: 1;
    color: #f4fff9;
    animation: letterIn .75s cubic-bezier(.16,1,.3,1) both;
  }
  .word .b { font-weight: 600; }
  .word .l { font-weight: 400; color: rgba(244,255,249,.92); }
  .word .gap { width: .32em; animation: none; }
  @keyframes letterIn {
    from { opacity: 0; transform: translateY(80px); filter: blur(14px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  /* shimmer sweep across the finished wordmark */
  .sheen {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.16) 50%, transparent 58%);
    transform: translateX(-100%);
    animation: sheenMove 1.1s cubic-bezier(.4,0,.2,1) both;
    mix-blend-mode: screen;
  }
  @keyframes sheenMove { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* closing dip to black */
  .veil { position: absolute; inset: 0; background: #040a07; animation: veilIn .45s ease-in both; }
  @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <div class="glow" data-d="0.0"></div>
  <div class="stage">
    <div class="weare" data-d="1.25">We are</div>
    <div class="mark-wrap">
      <svg class="mark" viewBox="-16 -16 300 312" aria-hidden="true">
        <path class="bar1" data-d="0.35" d="M0 279V253.5A38.5 38.5 0 0 1 77 253.5V279H0Z" fill="#9DF3C4"/>
        <path class="bar2" data-d="0.47" d="M93 279V202A37 37 0 0 1 167 202V279H93Z" fill="#74EAB7"/>
        <path class="bar3" data-d="0.59" d="M182 279V153A43 43 0 0 1 268 153V279H182Z" fill="#3FDA93"/>
        <path class="star" data-d="1.02" d="M225 1Q235.3 34.7 269 45Q235.3 55.3 225 89Q214.7 55.3 181 45Q214.7 34.7 225 1Z" fill="#3FDA93"/>
      </svg>
      <div class="ring"  data-d="1.12"></div>
      <div class="ring2" data-d="1.18"></div>
    </div>
    <div class="word" id="word"></div>
  </div>
  <div class="sheen" data-d="2.75"></div>
  <div class="veil"  data-d="3.55"></div>

<script>
  // wordmark: per-letter stagger — "podium" semibold + "momentum" light
  const word = document.getElementById('word')
  const t0 = 1.42, step = 0.045
  const mk = (ch, cls, i) => {
    const s = document.createElement('span')
    s.textContent = ch
    s.className = cls
    s.dataset.d = (t0 + i * step).toFixed(3)
    word.appendChild(s)
  }
  'podium'.split('').forEach((ch, i) => mk(ch, 'b', i))
  const gap = document.createElement('span'); gap.className = 'gap'; word.appendChild(gap)
  'momentum'.split('').forEach((ch, i) => mk(ch, 'l', i + 6))

  // deterministic seek: every animated element carries its base delay in
  // data-d; seeking rewinds delays so the paused animations hold time t
  document.querySelectorAll('[data-d]').forEach(el => {
    el.style.animationPlayState = 'paused'
  })
  window.seek = t => {
    document.querySelectorAll('[data-d]').forEach(el => {
      el.style.animationDelay = (parseFloat(el.dataset.d) - t) + 's'
    })
  }
</script>
</body>
</html>
