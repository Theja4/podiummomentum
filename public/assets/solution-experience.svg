<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
  <title id="title">Digital experience</title><desc id="desc">Layered interface planes guide a clear path towards action.</desc>
  <defs>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E7FFF4" stop-opacity=".92"/><stop offset="1" stop-color="#6CDFA7" stop-opacity=".3"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5066FF"/><stop offset="1" stop-color="#1D285A"/></linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#07110C" flood-opacity=".3"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>.layer{transform-box:fill-box;transform-origin:center;animation:lift 6s ease-in-out infinite}.l2{animation-delay:-2s}.l3{animation-delay:-4s}.path{stroke-dasharray:10 12;animation:flow 2.1s linear infinite}.cursor{animation:cursor 5s cubic-bezier(.45,0,.2,1) infinite}@keyframes lift{50%{transform:translateY(-10px)}}@keyframes flow{to{stroke-dashoffset:-44}}@keyframes cursor{0%,100%{transform:translate(0)}45%{transform:translate(90px,-56px)}60%{transform:translate(90px,-56px) scale(.9)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <ellipse cx="300" cy="250" rx="224" ry="135" fill="#5267FF" opacity=".09"/>
  <g filter="url(#shadow)">
    <g class="layer l3"><path d="m110 283 305-68 91 54-304 76Z" fill="url(#base)" stroke="#8E9CFF" stroke-opacity=".65"/><path d="m156 286 183-41" stroke="#B7C0FF" stroke-width="5" stroke-linecap="round" opacity=".52"/><circle cx="410" cy="276" r="10" fill="#FF8A4C"/></g>
    <g class="layer l2"><path d="m100 224 319-72 85 55-312 75Z" fill="#101D18" stroke="#87E8B5" stroke-opacity=".5"/><rect x="174" y="202" width="110" height="18" rx="9" transform="rotate(-13 174 202)" fill="#67E0A3" opacity=".78"/><rect x="304" y="172" width="121" height="12" rx="6" transform="rotate(-13 304 172)" fill="#E6FFF2" opacity=".25"/></g>
    <g class="layer l1"><path d="m117 144 310-70 80 54-309 73Z" fill="url(#pane)" stroke="#E6FFF2" stroke-opacity=".85"/><circle cx="178" cy="141" r="9" fill="#FF6B61"/><circle cx="204" cy="135" r="9" fill="#FFAE5D"/><circle cx="230" cy="129" r="9" fill="#67E0A3"/><path d="m284 117 131-30" stroke="#0D291B" stroke-width="9" stroke-linecap="round" opacity=".65"/><path d="m172 171 95-22M288 145l153-35" stroke="#0D291B" stroke-width="6" stroke-linecap="round" opacity=".32"/></g>
  </g>
  <path class="path" d="M176 313c54 38 92-69 150-36s82-29 119-63" fill="none" stroke="#E9FFF5" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <g transform="translate(170 298)"><g class="cursor"><path d="m0 0 5 53 13-15 16 22 11-8-16-21 20-8Z" fill="#E9FFF5" stroke="#0D2117" stroke-width="3"/><circle cx="49" cy="-3" r="15" fill="#FF6B61"/><path d="m43-3 5 5 9-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <g fill="#79F5BA"><circle cx="92" cy="115" r="5"/><circle cx="494" cy="327" r="4"/><circle cx="468" cy="71" r="3"/></g>
</svg>
